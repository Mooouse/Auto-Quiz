name: Publish AUTO QUIZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out game source
        uses: actions/checkout@v6
      - name: Set up Python for car photo processing
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-photos.txt
      - name: Install photo processing libraries
        run: python -m pip install -r scripts/requirements-photos.txt
      - name: Process selected Wikimedia Commons car photos
        run: python scripts/ingest-commons.py
      - name: Screen source photos for background vehicles
        run: |
          python -m py_compile scripts/approve-photos.py
          python -m unittest discover -s scripts -p 'test_photo_*.py'
          python scripts/approve-photos.py
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install game dependencies
        run: npm ci
      - name: Prepare pinned game platform
        run: npm run setup
      - name: Test and build game
        run: npm run check
      - name: Commit new game photographs and catalog
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- public/cars/ public/data/cars.json docs/ASSET-INGEST-REPORT.json docs/PHOTO-FRAME-AUDIT.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/cars/ public/data/cars.json docs/ASSET-INGEST-REPORT.json docs/PHOTO-FRAME-AUDIT.json
            git commit -m "Add screened full-scene photos and silhouettes [skip ci]"
            git push
          else
            echo "All curated cars are already installed"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload game build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
