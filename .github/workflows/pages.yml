name: Publish AUTO QUIZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out game source
        uses: actions/checkout@v6
      - name: Set up Python for car photo processing
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-photos.txt
      - name: Install photo processing libraries
        run: python -m pip install -r scripts/requirements-photos.txt
      - name: Process selected Wikimedia Commons car photos
        run: python scripts/ingest-commons.py
      - name: Screen source photos for background vehicles
        run: |
          python -m py_compile scripts/approve-photos.py
          python -m unittest discover -s scripts -p 'test_photo_*.py'
          python scripts/approve-photos.py
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install game dependencies
        run: npm ci
      - name: Prepare pinned game platform
        run: npm run setup
      - name: Test and build game
        run: npm run check
      - name: Commit new game photographs and catalog
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- public/cars/ public/data/cars.json docs/ASSET-INGEST-REPORT.json docs/PHOTO-FRAME-AUDIT.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/cars/ public/data/cars.json docs/ASSET-INGEST-REPORT.json docs/PHOTO-FRAME-AUDIT.json
            git commit -m "Add screened full-scene photos and silhouettes [skip ci]"
            git push
          else
            echo "All curated cars are already installed"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload game build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep only artifacts from the latest successful build
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Artifacts for the current run stay available for download.
          # Previous runs' artifacts are no longer needed after success.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, (.workflow_run.id // 0)] | @tsv' \
            > "${RUNNER_TEMP}/artifact-list.tsv"
          while IFS=$'\t' read -r artifact_id run_id; do
            if [[ "${run_id}" != "${GITHUB_RUN_ID}" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              echo "Removed old artifact ${artifact_id} (run ${run_id})"
            fi
          done < "${RUNNER_TEMP}/artifact-list.tsv"

      - name: Remove current Pages upload after publication
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
            > "${RUNNER_TEMP}/current-pages-artifacts.txt"
          while IFS= read -r artifact_id; do
            [[ -n "${artifact_id}" ]] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null
            echo "Deleted successfully deployed Pages artifact ${artifact_id}"
          done < "${RUNNER_TEMP}/current-pages-artifacts.txt"
